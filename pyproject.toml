[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-crop-rl"
version = "0.1.0"
description = "PPO crop-management research environment based on proposal_revised.pdf"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch==2.5.1", "numpy==2.0.1", "gymnasium==1.2.2",
  "stable-baselines3==2.7.1", "sb3-contrib==2.7.1",
  "PyYAML==6.0.3", "tensorboard==2.20.0",
  "pandas==2.3.3", "scipy==1.15.3", "matplotlib==3.10.7",
]

[tool.setuptools.packages.find]
where = ["src"]
